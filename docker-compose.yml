services:
  banco:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: perai
      POSTGRES_USER: perai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dados_banco:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perai -d perai"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://perai:${POSTGRES_PASSWORD}@banco:5432/perai
    volumes:
      - arquivos:/dados   # áudios, prints e conversas originais (fora do Git)
    depends_on:
      banco:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: .
    command: ["python", "-m", "perai.web"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://perai:${POSTGRES_PASSWORD}@banco:5432/perai
    depends_on:
      banco:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  dados_banco:
  arquivos:
  caddy_dados:
  caddy_config:
