[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perai"
version = "0.1.0"
description = "Peraí — assistente pessoal com memória (MVP)"
requires-python = ">=3.11"
dependencies = []  # só biblioteca padrão

[project.optional-dependencies]
audio = ["mutagen>=1.47"]  # duração dos áudios, para estimar o custo da transcrição


[project.scripts]
perai-teste = "teste_comparativo.rodar:main"

[tool.setuptools.packages.find]
include = ["perai*", "teste_comparativo*"]
